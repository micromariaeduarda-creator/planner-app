Nome: Criar e publicar no GitHub Pages

em: push: branches: - principal

permissões: conteúdo: leitura páginas: gravação token de identificação: gravação

jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Usar Node.js uses: actions/setup-node@v4 with: node-version: '18' - name: Instalar dependências run: npm install - name: Compilar run: npm run build - name: Enviar artefato para o GitHub Pages uses: actions/upload-pages-artifact@v1 with: path: ./dist

deploy: needs: build runs-on: ubuntu-latest steps: - name: Deploy to GitHub Pages uses: actions/deploy-pages@v1
